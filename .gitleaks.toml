[extend]
useDefault = true

# These exact values are Lockbox resource references and the SHA-256 fingerprint
# of the reviewed development access-key ID, not credential values. The fingerprint
# binds the publication/readback receipts to the version-pinned staging identity.
# Match the detected value so this survives merges and evidence line changes.
[allowlist]
description = "Reviewed G8 resource IDs, access-ID fingerprint and metadata receipt checksum"
regexTarget = "secret"
regexes = [
  '''^mbsec-e00arhndyprqr8egjw$''',
  '''^mbsec-e00s7qtjj5n9ghacnh$''',
  '''^4f129534101211604ce259cd5ded383065384b86797e8f7b407a810750062d5d$''',
  # SHA-256 of production-key-after.json (inactive key metadata, no secret payload).
  # Recorded in docs/evidence/g8-native-recovery-20260917.json.
  '''^d2767929d188abcef2461848d2055aa1d4812ba602e69cbf33580d50c37fd288$''',
  # SHA-256 of the September 21 inactive final-key metadata readback, no payload.
  # Recorded in docs/evidence/g8-production-readiness-20260921.json.
  '''^7b8ed849bd6bb128aee8cf2b864bae95c1fbd72c13c1b7143bf275480e3244e8$''',
  # SHA-256 of the transport probe's inactive final-key metadata, no credential payload.
  # Recorded in docs/evidence/g8-production-transport-probe-20260921.json.
  '''^aa065207725aea9e0134cd762ff16c41770a67b575e6a9394d4a0d7340cf9d25$''',
  # SHA-256 of R2's inactive final-key metadata receipt, independently rehashed.
  # Recorded in docs/evidence/g8-comparison-semantics-r2-20260921.json; no secret payload.
  '''^e2abf815f17ae88f28b0d9d1d7c2f5f1f2d6008ab9c7d8f0a1f6105a065fb0fe$''',
]
