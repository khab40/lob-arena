[project]
name = "lob-arena-backend"
version = "0.1.0"
description = "Adversarial synthetic market simulation for surveillance benchmarking."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.0.0",
  "starlette>=1.6.0",
  "pyyaml>=6.0.3",
  "uvicorn>=0.52.4",
  "uvloop>=0.22.1",
  "httptools>=0.7.1",
  "websockets>=15.0.1",
  "protobuf>=7.35.1",
  "grpcio>=1.82.1",
  "pyarrow==25.0.0",
]

[project.optional-dependencies]
ml = [
  "gitpython>=3.1.58,<4.0.0",
  "lightgbm>=4.6.0,<5.0.0",
  "mlflow-skinny==3.15.2",
  "scikit-learn>=1.7.2,<2.0.0",
  "sqlparse>=0.6.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "grpcio-tools>=1.82.1",
  "langgraph>=0.2.0",
  "pytest>=8.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
