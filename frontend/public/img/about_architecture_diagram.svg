<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title description">
  <title id="title">LOB Arena architecture</title>
  <desc id="description">Java owns the live clock, exchange, book, scenarios and detectors. Python provides AI and ML orchestration. External agents read snapshots and submit bounded intents. Nebius Jobs publish retained evidence.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#67e8f9"/></marker></defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #e2eff8; text-anchor: middle; font-size: 15px; }
    .heading { fill: #a7c7d8; font-size: 13px; font-weight: 700; }
    .name { font-weight: 700; font-size: 18px; }
    rect { fill: #102233; stroke: #38bdf8; stroke-width: 1.6; rx: 12px; }
    .cloud { fill: #231d3b; stroke: #a78bfa; }
    .evidence { fill: #0f2b22; stroke: #4ade80; }
    .edge { fill: none; stroke: #67e8f9; stroke-width: 2; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #bae6fd; paint-order: stroke; stroke: #07111b; stroke-width: 5px; }
  </style>
  <path d="M0 0 H1120 V560 H0 Z" fill="#07111b"/>
  <text class="heading" x="145" y="30">USER SURFACE</text>
  <text class="heading" x="485" y="30">RUNTIME AND CONTROL</text>
  <text class="heading" x="875" y="30">EXTERNAL COMPUTE</text>
  <rect x="35" y="70" width="220" height="140"/>
  <text x="145" y="105"><tspan class="name" x="145">React / Vite UI</tspan><tspan x="145" dy="28">Arena and Detection</tspan><tspan x="145" dy="24">Data Ingestion</tspan><tspan x="145" dy="24">Nebius controls / About</tspan></text>
  <rect x="360" y="65" width="250" height="150"/>
  <text x="485" y="100"><tspan class="name" x="485">Java market kernel</tspan><tspan x="485" dy="28">Sole writer: clock / book</tspan><tspan x="485" dy="24">Scenarios / rules / replay</tspan><tspan x="485" dy="24">Live REST + WebSocket</tspan></text>
  <rect x="745" y="70" width="260" height="140"/>
  <text x="875" y="105"><tspan class="name" x="875">External agent workers</tspan><tspan x="875" dy="28">Read-only snapshots</tspan><tspan x="875" dy="24">Bounded intents to Java</tspan><tspan x="875" dy="24">No exchange ownership</tspan></text>
  <rect x="360" y="285" width="250" height="130"/>
  <text x="485" y="320"><tspan class="name" x="485">Python / FastAPI</tspan><tspan x="485" dy="28">AI report / scenario adapters</tspan><tspan x="485" dy="24">ML and Job orchestration</tspan><tspan x="485" dy="24">Artifact APIs</tspan></text>
  <rect class="cloud" x="745" y="285" width="260" height="130"/>
  <text x="875" y="320"><tspan class="name" x="875">Nebius</tspan><tspan x="875" dy="28">AI endpoints / batch Jobs</tspan><tspan x="875" dy="24">Governed offline research</tspan><tspan x="875" dy="24">Object storage publication</tspan></text>
  <rect class="evidence" x="360" y="470" width="645" height="65"/>
  <text x="682" y="498"><tspan class="name" x="682">Retained evidence</tspan><tspan x="682" dy="23">Events / snapshots / alerts / reports / benchmark artifacts</tspan></text>
  <path class="edge" d="M255 140 H360"/><text class="label" x="307" y="125">live REST / WS</text>
  <path class="edge" d="M610 115 H745"/><text class="label" x="677" y="99">snapshots</text>
  <path class="edge" d="M745 178 H610"/><text class="label" x="677" y="198">bounded intents</text>
  <path class="edge" d="M145 210 V350 H360"/><text class="label" x="251" y="334">AI / ML requests</text>
  <path class="edge" d="M610 350 H745"/><text class="label" x="677" y="333">AI / Jobs</text>
  <path class="edge" d="M875 415 V470"/><text class="label" x="955" y="447">cloud outputs</text>
  <path class="edge" d="M485 415 V470"/><text class="label" x="550" y="447">reports</text>
  <path class="edge" d="M360 187 H305 V502 H360"/><text class="label" x="273" y="432">runtime artifacts</text>
  <path class="edge" d="M360 516 H70 V210" stroke-dasharray="6 6"/><text class="label" x="196" y="535">artifact links to UI</text>
</svg>
