version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/serverless/endpoint"
      - "/serverless/jobs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/agent-runner"
      - "/backend"
      - "/deployments/mlflow"
      - "/frontend"
      - "/java"
      - "/serverless/endpoint"
      - "/serverless/jobs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
