version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      frontend-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/serverless/endpoint"
      - "/serverless/jobs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      python-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pyarrow"
        versions:
          - ">=25.0.1"
      # Keep SDK 0.67.0 while Jobs require protobuf>=7.36.1,<8.0.0.
      # SDK 0.139.0 requires protobuf<7 (see PR #196).
      # Remove this rule after an SDK release supports Protobuf 7 and passes
      # dependency resolution, compatibility tests, and the Jobs image build.
      # update-types suppresses version updates only; security updates stay enabled.
      - dependency-name: "databricks-sdk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directories:
      - "/agent-runner"
      - "/backend"
      - "/deployments/mlflow"
      - "/frontend"
      - "/java"
      - "/serverless/endpoint"
      - "/serverless/jobs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      runtime-image-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      runtime-image-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "python"
        versions:
          - ">= 3.12"
      - dependency-name: "node"
        versions:
          - ">= 25"
      - dependency-name: "vllm/vllm-openai"
        versions:
          - ">= 0.11"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      java-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      java-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
