name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    # ensure Python can import top-level packages like `serverless`
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --dev --frozen

      - name: Run Ruff
        run: uv run --project backend ruff check backend serverless scripts

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -c pyproject.toml tests --junitxml=test-results.xml

      - name: Upload backend test report
        if: ${{ always() && hashFiles('backend/test-results.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend contract tests
        run: pnpm test

      - name: Run ESLint
        run: pnpm run lint

      - name: Build production frontend
        run: pnpm run build

  lightgbm-phase1:
    name: LightGBM governed data boundary
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install governed ML dependencies
        run: uv sync --project backend --dev --extra ml --frozen

      - name: Verify ML dependency imports
        run: uv run --project backend --extra ml python -c "import lightgbm, mlflow, sklearn"

      - name: Run LightGBM Phase 0, Phase 1 and Phase 2 tests
        working-directory: backend
        run: uv run --extra ml pytest tests/test_lightgbm_phase0_contracts.py tests/test_lightgbm_governed_data.py tests/test_lightgbm_training.py

  java-kernel:
    name: Java 25 kernel and control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: java
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            java/*.gradle.kts
            java/gradle/wrapper/gradle-wrapper.properties
            java/**/build.gradle.kts

      - name: Validate Java modules
        run: ./gradlew clean check --no-daemon

      - name: Upload Java test reports
        if: ${{ always() && hashFiles('java/**/build/reports/tests/test/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: java-test-reports
          path: java/**/build/reports/tests/test
          if-no-files-found: ignore

  java-golden-replay:
    name: Permanent Java golden corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            java/*.gradle.kts
            java/gradle/wrapper/gradle-wrapper.properties
            java/**/build.gradle.kts

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked Python dependencies
        run: uv sync --project backend --dev --frozen

      - name: Build production Java kernel
        working-directory: java
        run: ./gradlew :control-plane:bootJar --no-daemon

      - name: Replay immutable golden corpus
        env:
          LOB_KERNEL_GRPC_ENABLED: "true"
          ARENA_REMOTE_AGENT_URLS: ""
        run: |
          set -euo pipefail
          kernel_jar="$(find java/control-plane/build/libs -maxdepth 1 -name 'control-plane-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$kernel_jar"
          java -jar "$kernel_jar" > java-kernel-ci.log 2>&1 &
          kernel_pid=$!
          trap 'kill "$kernel_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if python -c 'import socket; socket.create_connection(("127.0.0.1", 50051), 1).close()'; then
              uv run --project backend python scripts/run_java_golden_corpus.py --target 127.0.0.1:50051
              curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
                --header 'Content-Type: application/x-protobuf' \
                --data-binary @contracts/golden/parity-v1/cases/normal-market-seed-42/request.pb \
                --output java-kernel-http-result.pb \
                http://127.0.0.1:8080/api/kernel/run
              cmp \
                java-kernel-http-result.pb \
                contracts/golden/parity-v1/cases/normal-market-seed-42/expected-result.pb
              python -c 'import json, urllib.request; status=json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/kernel/status")); assert status == {"authority": "java", "implementation": "java", "pythonFallback": False, "pythonReplay": False, "contractVersion": 1}'
              python -c 'import json, urllib.request; state=json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/arena/state")); assert state["tick"] == 0 and state["running"] is False and state["book"]["bids"] and state["book"]["asks"]'
              curl --fail --silent --show-error --request POST http://127.0.0.1:8080/api/scenarios/spoofing-like > /dev/null
              curl --fail --silent --show-error --request POST http://127.0.0.1:8080/internal/arena/step > /dev/null
              curl --fail --silent --show-error --request POST http://127.0.0.1:8080/internal/arena/step > /dev/null
              curl --fail --silent --show-error --request POST http://127.0.0.1:8080/internal/arena/step > /dev/null
              python -c 'import json, urllib.request; incidents=json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/incidents")); assert len(incidents) == 1 and incidents[0]["scenario_family"] == "spoofing_like_wall"'
              exit 0
            fi
            if ! kill -0 "$kernel_pid" 2>/dev/null; then
              cat java-kernel-ci.log
              exit 1
            fi
            sleep 1
          done
          cat java-kernel-ci.log
          exit 1

      - name: Upload Java golden replay service log
        if: ${{ failure() && hashFiles('java-kernel-ci.log') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: java-kernel-golden-replay-log
          path: java-kernel-ci.log
          if-no-files-found: ignore

  deterministic-evaluation:
    name: Deterministic CPU evaluation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --dev --frozen

      - name: Generate fixed synthetic scenarios
        run: uv run --project backend python scripts/generate_scenarios.py --samples 3 --output outputs/ci-eval/synthetic-dataset

      - name: Run small local evaluation
        run: uv run --project backend python scripts/run_local_eval.py --runs 3 --batch-size 2 --output outputs/ci-eval

      - name: Validate generated artifacts
        run: uv run --project backend python scripts/validate_ci_artifacts.py outputs/ci-eval

      - name: Upload deterministic evaluation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deterministic-evaluation
          path: outputs/ci-eval
          if-no-files-found: error
          retention-days: 14

  agent-workspace:
    name: Agent workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install agent workspace dependencies
        run: uv sync --project backend --dev --frozen

      - name: Validate agent workspace contract
        run: uv run --project backend python scripts/validate_agent_workspace.py

  application-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: agent-runner
            context: .
            file: agent-runner/Dockerfile
          - name: java-kernel
            context: .
            file: java/Dockerfile
          - name: mlflow
            context: deployments/mlflow
            file: deployments/mlflow/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: lob-arena-ci/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test backend runtime imports
        if: ${{ matrix.name == 'backend' }}
        run: docker run --rm lob-arena-ci/backend:${{ github.sha }} python -m app.runtime_smoke --minimal-image

      - name: Smoke test Java runtime layout
        if: ${{ matrix.name == 'java-kernel' }}
        run: docker run --rm --entrypoint sh lob-arena-ci/java-kernel:${{ github.sha }} -c 'test "$(id -u)" -ne 0 && test -r /app/app.jar'

      - name: Smoke test MLflow runtime dependencies
        if: ${{ matrix.name == 'mlflow' }}
        run: docker run --rm --entrypoint python lob-arena-ci/mlflow:${{ github.sha }} -c 'import boto3, mlflow, psycopg2; assert mlflow.__version__ == "3.13.0"'

  compose:
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create safe local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate serverless Compose configuration
        env:
          NEBIUS_SERVERLESS_ENABLED: "true"
          NEBIUS_CLI_CONFIG_DIR: ./deployments/nebius-cli-empty
          NEBIUS_ENDPOINT_BASE_URL: https://example.invalid
          NEBIUS_JOB_SUBMIT_COMMAND_TEMPLATE: submit-job
        run: |
          docker compose config --format json | jq -e '
            .services.backend as $backend
            | ($backend.build.args.INSTALL_NEBIUS_CLI == "true")
              and ($backend.environment.NEBIUS_SERVERLESS_ENABLED == "true")
              and ($backend.environment.NEBIUS_ENDPOINT_BASE_URL == "https://example.invalid")
              and ($backend.environment.NEBIUS_JOB_SUBMIT_COMMAND_TEMPLATE == "submit-job")
          '

      - name: Validate observability profile combinations
        run: |
          test "$(docker compose --profile prometheus config --services | grep -E '^(prometheus|grafana)$' | paste -sd, -)" = "prometheus"
          test "$(docker compose --profile grafana config --services | grep -E '^(prometheus|grafana)$' | sort | paste -sd, -)" = "grafana,prometheus"
          test "$(docker compose --profile monitoring config --services | grep -E '^(prometheus|grafana)$' | sort | paste -sd, -)" = "grafana,prometheus"

      - name: Validate MLflow profile
        run: |
          test "$(docker compose --profile mlflow config --services | grep '^mlflow' | sort | paste -sd, -)" = "mlflow,mlflow-minio,mlflow-minio-init,mlflow-postgres"

      - name: Verify local mode defaults to the serverless guard
        env:
          NEBIUS_JOB_SUBMIT_COMMAND_TEMPLATE: should-not-run
          NEBIUS_JOB_STATUS_COMMAND_TEMPLATE: should-not-run
          NEBIUS_JOB_LOGS_COMMAND_TEMPLATE: should-not-run
          NEBIUS_JOB_ARTIFACTS_COMMAND_TEMPLATE: should-not-run
        run: |
          docker compose config --format json | jq -e '
            .services.backend as $backend
            | ($backend.build.args.INSTALL_NEBIUS_CLI == "false")
              and ($backend.environment.NEBIUS_SERVERLESS_ENABLED == "false")
          '

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
