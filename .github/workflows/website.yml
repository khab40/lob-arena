name: Public website

on:
  pull_request:
    paths: ['website/**', 'frontend/package.json', 'frontend/pnpm-lock.yaml', 'frontend/patches/**', 'frontend/test/braces-depth-security.test.mjs', 'frontend/test/transitive-security.test.mjs', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'frontend/package.json', 'frontend/pnpm-lock.yaml', 'frontend/patches/**', 'frontend/test/braces-depth-security.test.mjs', 'frontend/test/transitive-security.test.mjs', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Website lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: website-browser-results
          path: website/test-results/
          retention-days: 7
      - name: Package static output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy public website
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
