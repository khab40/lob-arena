spring.application.name=lob-arena-java-control-plane
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.lob.kernel.grpc.duration=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${LOB_KERNEL_TRACE_SAMPLE_PROBABILITY:0.1}
management.otlp.metrics.export.enabled=${LOB_KERNEL_OTLP_METRICS_ENABLED:false}
management.tracing.export.otlp.enabled=${LOB_KERNEL_OTLP_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.opentelemetry.resource-attributes.service.namespace=lob-arena
management.opentelemetry.resource-attributes.service.version=0.1.0-SNAPSHOT
lob.kernel.grpc.enabled=${LOB_KERNEL_GRPC_ENABLED:false}
lob.kernel.grpc.port=${LOB_KERNEL_GRPC_PORT:50051}
lob.agents.runner-urls=${ARENA_REMOTE_AGENT_URLS:http://agent-runner:9100}
lob.agents.runner-timeout-ms=${ARENA_REMOTE_AGENT_TIMEOUT_MS:250}
lob.arena.tick-interval-ms=${ARENA_TICK_INTERVAL_MS:500}
lob.arena.websocket.stream-interval-ms=${ARENA_WEBSOCKET_STREAM_INTERVAL_MS:500}
lob.arena.output-dir=${ARENA_OUTPUT_DIR:../outputs}
lob.arena.historical-data-dir=${LOB_ARENA_HISTORICAL_DATA_DIR:../../data/processed/lobster}
lob.arena.historical-csv-data-dir=${LOB_ARENA_HISTORICAL_CSV_DATA_DIR:../../data/historical}
lob.arena.historical-rows-per-tick=${LOB_ARENA_HISTORICAL_ROWS_PER_TICK:250}
lob.arena.master-seed=${LOB_ARENA_MASTER_SEED:42}
lob.arena.event-history-capacity=${LOB_ARENA_EVENT_HISTORY_CAPACITY:50000}
lob.arena.event-archive-segment-events=${LOB_ARENA_EVENT_ARCHIVE_SEGMENT_EVENTS:25000}
lob.arena.event-archive-max-stream-bytes=${LOB_ARENA_EVENT_ARCHIVE_MAX_STREAM_BYTES:21474836480}
lob.arena.duckdb.memory-limit=${LOB_ARENA_DUCKDB_MEMORY_LIMIT:1GB}
lob.arena.duckdb.threads=${LOB_ARENA_DUCKDB_THREADS:2}
lob.arena.duckdb.temp-directory=${LOB_ARENA_DUCKDB_TEMP_DIRECTORY:/tmp/lob-arena-duckdb}
lob.arena.duckdb.max-temp-directory-size=${LOB_ARENA_DUCKDB_MAX_TEMP_DIRECTORY_SIZE:8GB}
lob.arena.market-profiles-dir=${LOB_ARENA_MARKET_PROFILES_DIR:../../configs/market-profiles}
