name: lob-arena

services:
  java-kernel:
    build:
      context: .
      dockerfile: java/Dockerfile
    mem_limit: ${JAVA_KERNEL_MEMORY_LIMIT:-4g}
    environment:
      JAVA_TOOL_OPTIONS: "${JAVA_KERNEL_JAVA_TOOL_OPTIONS:--Xms256m -Xmx2g -XX:MaxDirectMemorySize=256m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/outputs/diagnostics/java-kernel.hprof}"
      LOB_KERNEL_GRPC_ENABLED: "true"
      LOB_KERNEL_GRPC_PORT: "50051"
      LOB_KERNEL_OTLP_ENABLED: ${LOB_KERNEL_OTLP_ENABLED:-false}
      LOB_KERNEL_OTLP_METRICS_ENABLED: ${LOB_KERNEL_OTLP_METRICS_ENABLED:-false}
      LOB_KERNEL_TRACE_SAMPLE_PROBABILITY: ${LOB_KERNEL_TRACE_SAMPLE_PROBABILITY:-0.1}
      ARENA_REMOTE_AGENT_URLS: ${ARENA_REMOTE_AGENT_URLS:-http://agent-runner:9100}
      ARENA_REMOTE_AGENT_TIMEOUT_MS: ${ARENA_REMOTE_AGENT_TIMEOUT_MS:-250}
      ARENA_TICK_INTERVAL_MS: ${ARENA_TICK_INTERVAL_MS:-500}
      ARENA_WEBSOCKET_STREAM_INTERVAL_MS: ${ARENA_WEBSOCKET_STREAM_INTERVAL_MS:-500}
      ARENA_OUTPUT_DIR: /app/outputs
      LOB_ARENA_HISTORICAL_DATA_DIR: /app/data/processed/lobster
      LOB_ARENA_HISTORICAL_CSV_DATA_DIR: /app/data/historical
      LOB_ARENA_HISTORICAL_ROWS_PER_TICK: ${LOB_ARENA_HISTORICAL_ROWS_PER_TICK:-250}
      LOB_ARENA_EVENT_HISTORY_CAPACITY: ${LOB_ARENA_EVENT_HISTORY_CAPACITY:-50000}
      LOB_ARENA_EVENT_ARCHIVE_SEGMENT_EVENTS: ${LOB_ARENA_EVENT_ARCHIVE_SEGMENT_EVENTS:-25000}
      LOB_ARENA_EVENT_ARCHIVE_MAX_STREAM_BYTES: ${LOB_ARENA_EVENT_ARCHIVE_MAX_STREAM_BYTES:-21474836480}
      LOB_ARENA_DUCKDB_MEMORY_LIMIT: ${LOB_ARENA_DUCKDB_MEMORY_LIMIT:-1GB}
      LOB_ARENA_DUCKDB_THREADS: ${LOB_ARENA_DUCKDB_THREADS:-2}
      LOB_ARENA_DUCKDB_TEMP_DIRECTORY: ${LOB_ARENA_DUCKDB_TEMP_DIRECTORY:-/tmp/lob-arena-duckdb}
      LOB_ARENA_DUCKDB_MAX_TEMP_DIRECTORY_SIZE: ${LOB_ARENA_DUCKDB_MAX_TEMP_DIRECTORY_SIZE:-8GB}
    ports:
      - "8081:8080"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      agent-runner:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
      - ./data/processed/lobster:/app/data/processed/lobster:ro
      - ./data/historical:/app/data/historical:ro

  agent-runner:
    build:
      context: .
      dockerfile: agent-runner/Dockerfile
    environment:
      AGENT_RUNNER_ID: ${AGENT_RUNNER_ID:-remote-1}
      AGENT_RUNNER_AGENT_COUNT: ${AGENT_RUNNER_AGENT_COUNT:-24}
      AGENT_RUNNER_MAX_AGENT_COUNT: ${AGENT_RUNNER_MAX_AGENT_COUNT:-48}
      AGENT_RUNNER_HEAVY_AGENT_COUNT: ${AGENT_RUNNER_HEAVY_AGENT_COUNT:-0}
      AGENT_RUNNER_MAX_HEAVY_AGENT_COUNT: ${AGENT_RUNNER_MAX_HEAVY_AGENT_COUNT:-2}
      AGENT_RUNNER_HEAVY_AGENT_COMPLEXITY: ${AGENT_RUNNER_HEAVY_AGENT_COMPLEXITY:-20000}
      AGENT_RUNNER_HEAVY_AGENT_WORKERS: ${AGENT_RUNNER_HEAVY_AGENT_WORKERS:-1}
      AGENT_RUNNER_MAX_HEAVY_AGENT_WORKERS: ${AGENT_RUNNER_MAX_HEAVY_AGENT_WORKERS:-1}
      AGENT_RUNNER_LANGGRAPH_AGENT_COUNT: ${AGENT_RUNNER_LANGGRAPH_AGENT_COUNT:-0}
      AGENT_RUNNER_MAX_LANGGRAPH_AGENT_COUNT: ${AGENT_RUNNER_MAX_LANGGRAPH_AGENT_COUNT:-4}
      AGENT_RUNNER_LANGGRAPH_STRATEGY: ${AGENT_RUNNER_LANGGRAPH_STRATEGY:-liquidity_rebalancer}
      AGENT_RUNNER_AGENT_ID_PREFIX: ${AGENT_RUNNER_AGENT_ID_PREFIX:-REMOTE}
      AGENT_RUNNER_DECISION_TIMEOUT_SECONDS: ${AGENT_RUNNER_DECISION_TIMEOUT_SECONDS:-0.05}
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_NEBIUS_CLI: ${NEBIUS_SERVERLESS_ENABLED:-false}
    environment:
      LOG_LEVEL: INFO
      ARENA_OUTPUT_DIR: /app/outputs
      ARENA_LOBSTER_RAW_DIR: /app/data/lobster
      ARENA_HISTORICAL_DATA_DIR: /app/data/processed/lobster
      ARENA_DATA_RETENTION_DAYS: ${ARENA_DATA_RETENTION_DAYS:-1}
      ARENA_LOCAL_BATCH_MAX_WORKERS: ${ARENA_LOCAL_BATCH_MAX_WORKERS:-1}
      JAVA_ARENA_BASE_URL: http://java-kernel:8080
      JAVA_ARENA_TIMEOUT_SECONDS: ${JAVA_ARENA_TIMEOUT_SECONDS:-2}
      # Retained only for Nebius/AI runner health reporting; Java orchestrates decisions.
      ARENA_REMOTE_AGENT_URLS: ${ARENA_REMOTE_AGENT_URLS:-http://agent-runner:9100}
      NEBIUS_SERVERLESS_ENABLED: ${NEBIUS_SERVERLESS_ENABLED:-false}
      ENDPOINT_TOKEN: ${ENDPOINT_TOKEN:-}
      NEBIUS_TENANT_ID: ${NEBIUS_TENANT_ID:-}
      NEBIUS_ENDPOINT_MODE: ${NEBIUS_ENDPOINT_MODE:-mock}
      NEBIUS_ENDPOINT_BASE_URL: ${NEBIUS_ENDPOINT_BASE_URL:-}
      NEBIUS_INCIDENT_EXPLAINER_URL: ${NEBIUS_INCIDENT_EXPLAINER_URL:-}
      NEBIUS_SCENARIO_GENERATOR_URL: ${NEBIUS_SCENARIO_GENERATOR_URL:-}
      NEBIUS_MARKET_ABUSE_SCENARIO_URL: ${NEBIUS_MARKET_ABUSE_SCENARIO_URL:-}
      NEBIUS_ORDERBOOK_ALERT_URL: ${NEBIUS_ORDERBOOK_ALERT_URL:-}
      NEBIUS_INVESTIGATION_REPORT_URL: ${NEBIUS_INVESTIGATION_REPORT_URL:-}
      NEBIUS_INVESTIGATION_TEAM_URL: ${NEBIUS_INVESTIGATION_TEAM_URL:-}
      NEBIUS_INFERENCE_TIMEOUT_SECONDS: ${NEBIUS_INFERENCE_TIMEOUT_SECONDS:-180}
      NEBIUS_INPUT_TOKEN_COST_PER_MILLION_USD: ${NEBIUS_INPUT_TOKEN_COST_PER_MILLION_USD:-0}
      NEBIUS_OUTPUT_TOKEN_COST_PER_MILLION_USD: ${NEBIUS_OUTPUT_TOKEN_COST_PER_MILLION_USD:-0}
      NEBIUS_JOB_COST_PER_HOUR_USD: ${NEBIUS_JOB_COST_PER_HOUR_USD:-0}
      NEBIUS_HEALTH_TIMEOUT_SECONDS: ${NEBIUS_HEALTH_TIMEOUT_SECONDS:-5}
      NEBIUS_LOCAL_TOURNAMENT_SCENARIO_LIMIT: ${NEBIUS_LOCAL_TOURNAMENT_SCENARIO_LIMIT:-24}
      NEBIUS_JOB_IMAGE: ${NEBIUS_JOB_IMAGE:-ghcr.io/khab40/lob-arena-jobs:latest}
      NEBIUS_SUBNET_ID: ${NEBIUS_SUBNET_ID:-}
      NEBIUS_PARENT_ID: ${NEBIUS_PARENT_ID:-}
      NEBIUS_VOLUME: ${NEBIUS_VOLUME:-}
      NEBIUS_JOB_OUTPUT_VOLUME: ${NEBIUS_JOB_OUTPUT_VOLUME:-}
      NEBIUS_JOB_OUTPUT_URI: ${NEBIUS_JOB_OUTPUT_URI:-}
      NEBIUS_OBJECT_STORAGE_ENDPOINT_URL: ${NEBIUS_OBJECT_STORAGE_ENDPOINT_URL:-}
      # Cloud commands remain inert unless explicitly configured. Enabling
      # serverless also installs the Nebius/AWS CLIs in this image build.
      NEBIUS_JOB_SUBMIT_COMMAND_TEMPLATE: ${NEBIUS_JOB_SUBMIT_COMMAND_TEMPLATE:-}
      NEBIUS_JOB_STATUS_COMMAND_TEMPLATE: ${NEBIUS_JOB_STATUS_COMMAND_TEMPLATE:-}
      NEBIUS_JOB_LOGS_COMMAND_TEMPLATE: ${NEBIUS_JOB_LOGS_COMMAND_TEMPLATE:-}
      NEBIUS_JOB_ARTIFACTS_COMMAND_TEMPLATE: ${NEBIUS_JOB_ARTIFACTS_COMMAND_TEMPLATE:-}
      NEBIUS_JOB_HEALTH_COMMAND: ${NEBIUS_JOB_HEALTH_COMMAND:-}
      NEBIUS_CLOUD_PROBE_TIMEOUT_SECONDS: ${NEBIUS_CLOUD_PROBE_TIMEOUT_SECONDS:-5}
      NEBIUS_OBJECT_STORAGE_ACCESS_KEY_ID: ${NEBIUS_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      NEBIUS_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${NEBIUS_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      NEBIUS_OBJECT_STORAGE_SESSION_TOKEN: ${NEBIUS_OBJECT_STORAGE_SESSION_TOKEN:-}
      NEBIUS_OBJECT_STORAGE_REGION: ${NEBIUS_OBJECT_STORAGE_REGION:-eu-north1}
      NEBIUS_EVIDENCE_ARCHIVE_ENABLED: ${NEBIUS_EVIDENCE_ARCHIVE_ENABLED:-false}
      NEBIUS_JOB_RUNS: ${NEBIUS_JOB_RUNS:-1000}
      NEBIUS_JOB_BATCH_SIZE: ${NEBIUS_JOB_BATCH_SIZE:-100}
      NEBIUS_JOB_OUTPUT_DIR: ${NEBIUS_JOB_OUTPUT_DIR:-/job/outputs/serverless-batch}
      NEBIUS_JOB_SCENARIOS: ${NEBIUS_JOB_SCENARIOS:-normal_market,spoofing_like_wall,layering_like,quote_stuffing,liquidity_evaporation}
    ports:
      - "8000:8000"
    depends_on:
      java-kernel:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ${NEBIUS_CLI_CONFIG_DIR:-./deployments/nebius-cli-empty}/config.yaml:/root/.nebius/config.yaml:ro
      - ${NEBIUS_CLI_CONFIG_DIR:-./deployments/nebius-cli-empty}/credentials.yaml:/root/.nebius/credentials.yaml:ro

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5173
      VITE_ARENA_MODE: websocket
      VITE_ARENA_WS_URL: ws://localhost:5173/ws/arena
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - java-kernel

  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: ["prometheus", "grafana", "monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      java-kernel:
        condition: service_healthy
      agent-runner:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./monitoring/prometheus/java-kernel.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.0.3
    profiles: ["grafana", "monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  mlflow-postgres:
    image: postgres:16.10-alpine
    profiles: ["mlflow"]
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-local-compose-validation-only}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    networks:
      - mlflow-internal

  mlflow-minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["mlflow"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MLFLOW_MINIO_ROOT_USER:-mlflow-admin}
      MINIO_ROOT_PASSWORD: ${MLFLOW_MINIO_ROOT_PASSWORD:-local-compose-validation-only}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mlflow-minio-data:/data
    networks:
      - mlflow-internal

  mlflow-minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["mlflow"]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: http://mlflow-minio:9000
      MINIO_ROOT_USER: ${MLFLOW_MINIO_ROOT_USER:-mlflow-admin}
      MINIO_ROOT_PASSWORD: ${MLFLOW_MINIO_ROOT_PASSWORD:-local-compose-validation-only}
      MLFLOW_MINIO_ACCESS_KEY: ${MLFLOW_MINIO_ACCESS_KEY:-mlflow-artifacts}
      MLFLOW_MINIO_SECRET_KEY: ${MLFLOW_MINIO_SECRET_KEY:-local-compose-validation-only}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-lob-arena-mlflow}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local "$${MINIO_ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MLFLOW_S3_BUCKET}"
        mc anonymous set none "local/$${MLFLOW_S3_BUCKET}"
        mc admin user info local "$${MLFLOW_MINIO_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${MLFLOW_MINIO_ACCESS_KEY}" "$${MLFLOW_MINIO_SECRET_KEY}"
        mc admin policy attach local readwrite --user "$${MLFLOW_MINIO_ACCESS_KEY}"
    depends_on:
      mlflow-minio:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - mlflow-internal

  mlflow:
    build:
      context: ./deployments/mlflow
      dockerfile: Dockerfile
    image: lob-arena/mlflow:3.13.0
    profiles: ["mlflow"]
    environment:
      MLFLOW_POSTGRES_HOST: mlflow-postgres
      MLFLOW_POSTGRES_PORT: "5432"
      MLFLOW_POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      MLFLOW_POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-local-compose-validation-only}
      MLFLOW_POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MLFLOW_S3_BUCKET:-lob-arena-mlflow}/${MLFLOW_ARTIFACTS_PREFIX:-artifacts}
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-minio:9000
      AWS_ACCESS_KEY_ID: ${MLFLOW_MINIO_ACCESS_KEY:-mlflow-artifacts}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_MINIO_SECRET_KEY:-local-compose-validation-only}
      AWS_DEFAULT_REGION: ${MLFLOW_S3_REGION:-us-east-1}
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME:-admin}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-local-compose-validation-only}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:-local-compose-validation-only-change-before-use}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:5000}
      MLFLOW_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      MLFLOW_ENABLE_WORKSPACES: ${MLFLOW_ENABLE_WORKSPACES:-false}
      MLFLOW_SERVER_WORKERS: ${MLFLOW_SERVER_WORKERS:-2}
    ports:
      - "${MLFLOW_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5500}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - mlflow-internal
      - mlflow-edge

volumes:
  prometheus-data:
  grafana-data:
  mlflow-postgres-data:
  mlflow-minio-data:

networks:
  mlflow-internal:
    internal: true
  mlflow-edge:
